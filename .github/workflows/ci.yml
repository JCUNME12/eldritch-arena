name: CI

on:
  push:
    branches:
      - main
      - "upgrade/**"
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: eldritch_arena_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d eldritch_arena_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: eldritch_arena_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_SSLMODE: disable
      SESSION_DRIVER: array
      CACHE_STORE: array
      QUEUE_CONNECTION: sync

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: intl, mbstring, pdo_pgsql
          coverage: none

      - name: Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: npm 11
        run: npm install --global npm@11

      - name: Composer cache
        uses: actions/cache@v5
        with:
          path: ~/.composer/cache/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: |
          composer validate --strict
          composer install --no-interaction --no-progress --prefer-dist

      - name: Install and build frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Audit frontend dependencies
        shell: bash
        run: |
          set +e
          audit_output="$(timeout 90s npm audit --audit-level=high 2>&1)"
          audit_status=$?
          set -e

          printf '%s\n' "$audit_output"

          if [ "$audit_status" -eq 0 ]; then
            exit 0
          fi

          if [ "$audit_status" -eq 124 ] || printf '%s\n' "$audit_output" | grep -Eq 'audit endpoint returned an error| (500|502|503|504) '; then
            echo "::warning::npm security service is temporarily unavailable; dependency findings remain visible through GitHub dependency alerts."
            exit 0
          fi

          exit "$audit_status"

      - name: Validate PostgreSQL schema and seeders
        run: php artisan migrate:fresh --seed --force

      - name: Test application
        run: php artisan test

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Audit PHP dependencies
        shell: bash
        run: |
          set +e
          audit_output="$(composer audit --locked 2>&1)"
          audit_status=$?
          set -e

          printf '%s\n' "$audit_output"

          if [ "$audit_status" -eq 0 ]; then
            exit 0
          fi

          if printf '%s\n' "$audit_output" | grep -Eq 'HTTP/[0-9.]+ 5[0-9]{2}|could not be downloaded'; then
            echo "::warning::Packagist security service is temporarily unavailable; the audit will run again on the next pipeline."
            exit 0
          fi

          exit "$audit_status"

  container:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build production image
        run: docker build --target production --tag eldritch-arena:test .
