services:
  app:
    build:
      context: .
      target: production
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      APP_NAME: "Eldritch Arena"
      APP_ENV: local
      APP_KEY: "${APP_KEY:?Defina APP_KEY no arquivo .env}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_TIMEZONE: America/Sao_Paulo
      APP_URL: "${APP_URL:-http://localhost:8080}"
      APP_LOCALE: pt_BR
      APP_FALLBACK_LOCALE: pt_BR
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: "${DB_DATABASE:-eldritch_arena}"
      DB_USERNAME: "${DB_USERNAME:-eldritch}"
      DB_PASSWORD: "${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}"
      DB_SSLMODE: disable
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: database
      LOG_CHANNEL: stderr
      RUN_MIGRATIONS: "true"
    volumes:
      - eldritch_storage:/var/www/html/storage/app/public
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${DB_DATABASE:-eldritch_arena}"
      POSTGRES_USER: "${DB_USERNAME:-eldritch}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Defina DB_PASSWORD no arquivo .env}"
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-eldritch} -d ${DB_DATABASE:-eldritch_arena}"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  eldritch_storage:
  postgres_data:
